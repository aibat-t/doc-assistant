[project]
name = "docs-assistant"
version = "0.1.0"
description = "RAG-ассистент по законодательству РК: асинхронная индексация, гибридный поиск, ответы с цитатами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "aio-pika>=9.5",
    "redis>=5.2",
    "anthropic>=0.40",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
# Тяжёлые зависимости (torch). Понадобятся на этапе 3, ставятся отдельно:
# uv sync --extra ml
ml = [
    "sentence-transformers>=3.3",
]

[project.scripts]
docs-assistant = "docs_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Комментарии и строки на русском: правила о «похожих» символах дают ложные срабатывания
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Папка миграций alembic/ в корне сбивает ruff: он считает пакет alembic своим
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: требует запущенной инфраструктуры (docker compose up)",
]
addopts = "-m 'not integration'"
