# Документы корпуса. Источник — ИПС «Әділет» (adilet.zan.kz).
#
# url      — канонический адрес документа: https://adilet.zan.kz/<rus|kaz>/docs/<код>
#            (казахская версия — тот же код, путь /kaz/ вместо /rus/)
# lang     — ru | kk, должен совпадать с языком в URL
# doc_type — code | law | decree; если не указан, берётся по первой букве кода (K — кодекс, Z — закон)
# title    — если не указан, берётся из <title> страницы
#
# Скачать:        uv run docs-assistant fetch
# Зарегистрировать: uv run docs-assistant register

